openapi: 3.1.0
info:
  title: p13i agent harness
  version: 1.4.0
  description: >-
    Durable provider-neutral agent sessions, goals, events,
    approvals, routing, checkpoints, terminals, and fleet
    transfer, external orchestration, reconciliation, and
    safe human-facing turn and diff projections.
servers:
  - url: https://localhost
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /readyz:
    get:
      operationId: ready
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sync:
    get:
      operationId: getChatSyncStatus
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
    post:
      operationId: syncChats
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions:
    get:
      operationId: listSessions
      parameters:
        - name: archived
          in: query
          schema:
            type: string
            enum:
              - "0"
              - "1"
        - name: external_orchestrator
          in: query
          schema:
            type: string
            maxLength: 128
        - name: external_job_id
          in: query
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
    post:
      operationId: createSession
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSession"
      responses:
        "201":
          $ref: "#/components/responses/JsonResponse"
        "409":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
    patch:
      operationId: configureSession
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/ui-state:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSessionUiState
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
    put:
      operationId: setSessionUiState
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/archive:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: archiveSession
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/unarchive:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: unarchiveSession
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listEvents
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/turns:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listPresentationTurns
      parameters:
        - $ref: "#/components/parameters/AfterSequence"
        - $ref: "#/components/parameters/PresentationLimit"
      responses:
        "200":
          description: Provider-neutral logical turn page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnPage"
  /v1/sessions/{session_id}/turns/{turn_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TurnId"
    get:
      operationId: getPresentationTurn
      responses:
        "200":
          description: One provider-neutral logical turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnDetail"
  /v1/sessions/{session_id}/usage:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSessionUsage
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/budget-extensions:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: extendSessionBudget
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetExtension"
      responses:
        "201":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/stream:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: streamEvents
      parameters:
        - $ref: "#/components/parameters/After"
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Ordered server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
  /v1/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: submitMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitMessage"
      responses:
        "202":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/commands/{command_type}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/CommandType"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: submitSessionCommand
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "202":
          $ref: "#/components/responses/JsonResponse"
  /v1/commands/{command_id}:
    parameters:
      - $ref: "#/components/parameters/CommandId"
    get:
      operationId: getCommand
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/approvals:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listApprovals
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/approvals/{approval_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/ApprovalId"
      - $ref: "#/components/parameters/OptionalIdempotencyKey"
    post:
      operationId: resolveApproval
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/goal:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getGoal
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/evidence:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/OptionalIdempotencyKey"
    post:
      operationId: addGoalEvidence
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/export:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/OptionalIdempotencyKey"
    post:
      operationId: exportSession
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/checkpoints:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/OptionalIdempotencyKey"
    post:
      operationId: checkpointSession
      responses:
        "201":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/checkpoints/{checkpoint_id}/diff:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/CheckpointId"
    get:
      operationId: getCheckpointDiff
      parameters:
        - $ref: "#/components/parameters/StartLine"
        - $ref: "#/components/parameters/DiffLimit"
      responses:
        "200":
          description: Redacted and bounded checkpoint diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckpointDiffResponse"
  /v1/sessions/{session_id}/fork:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/OptionalIdempotencyKey"
    post:
      operationId: forkSession
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/route:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: previewRoute
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/terminal:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: providerTerminal
      responses:
        "101":
          description: Authenticated provider PTY WebSocket
  /v1/sessions/{session_id}/reconciliations:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionReconciliations
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/reconciliations/{reconciliation_id}:
    parameters:
      - $ref: "#/components/parameters/ReconciliationId"
    get:
      operationId: inspectReconciliation
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/reconciliations/{reconciliation_id}/resolution:
    parameters:
      - $ref: "#/components/parameters/ReconciliationId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: resolveReconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconciliationResolution"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
        "409":
          $ref: "#/components/responses/JsonResponse"
  /v1/providers:
    get:
      operationId: providers
      parameters:
        - name: workspace
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/registry:
    get:
      operationId: registry
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/leases:
    get:
      operationId: listProcessLeases
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
    post:
      operationId: createProcessLease
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProcessLease"
      responses:
        "201":
          $ref: "#/components/responses/JsonResponse"
  /v1/leases/{lease_id}:
    parameters:
      - $ref: "#/components/parameters/LeaseId"
    patch:
      operationId: updateProcessLease
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProcessLease"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/fleet/keys:
    get:
      operationId: fleetKeys
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/transfers:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/OptionalIdempotencyKey"
    post:
      operationId: createTransfer
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonResponse"
  /v1/transfers/import:
    post:
      operationId: importTransfer
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/JsonResponse"
  /v1/sessions/{session_id}/transfers/finalize:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/OptionalIdempotencyKey"
    post:
      operationId: finalizeTransfer
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"
components:
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TurnId:
      name: turn_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CheckpointId:
      name: checkpoint_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandId:
      name: command_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LeaseId:
      name: lease_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReconciliationId:
      name: reconciliation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandType:
      name: command_type
      in: path
      required: true
      schema:
        type: string
        enum:
          - interrupt
          - pause
          - resume
          - steer
          - stop
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    After:
      name: after
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 1000
    AfterSequence:
      name: after_sequence
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    PresentationLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    StartLine:
      name: start_line
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    DiffLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 400
  requestBodies:
    JsonObject:
      required: false
      content:
        application/json:
          schema:
            type: object
  responses:
    JsonResponse:
      description: JSON response
      headers:
        X-Correlation-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
  schemas:
    PresentationAttempt:
      type: object
      additionalProperties: false
      required:
        - turn_id
        - attempt_id
        - provider
        - model
        - effort
        - status
        - started_at
        - ended_at
      properties:
        turn_id:
          type: string
        attempt_id:
          type: string
        provider:
          type: string
        model:
          type: string
        effort:
          type: string
        status:
          type: string
        started_at:
          type: string
        ended_at:
          type: string
    PresentationTurn:
      type: object
      additionalProperties: false
      required:
        - turn_id
        - turn_ids
        - command_id
        - turn_ref
        - request
        - status
        - started_at
        - completed_at
        - first_sequence
        - last_sequence
        - attempts
        - result
        - safety
        - checkpoint_id
        - evidence
        - reconciliation
        - activity
      properties:
        turn_id:
          type: string
        turn_ids:
          type: array
          items:
            type: string
        command_id:
          type: string
        turn_ref:
          type: object
        request:
          type: string
        status:
          type: string
        started_at:
          type: string
        completed_at:
          type: string
        first_sequence:
          type: integer
          minimum: 0
        last_sequence:
          type: integer
          minimum: 0
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/PresentationAttempt"
        result:
          type: object
        safety:
          type: object
        checkpoint_id:
          type: string
        evidence:
          type: array
          items:
            type: object
        reconciliation:
          type: object
        activity:
          type: array
          items:
            type: object
    TurnPage:
      type: object
      required:
        - schema
        - session_id
        - revision
        - after_sequence
        - next_after_sequence
        - turns
        - session_activity
      properties:
        schema:
          const: p13i/agent-harness/presentation/v1
        session_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        after_sequence:
          type: integer
          minimum: 0
        next_after_sequence:
          type: integer
          minimum: 0
        turns:
          type: array
          items:
            $ref: "#/components/schemas/PresentationTurn"
        session_activity:
          type: array
          items:
            type: object
    TurnDetail:
      type: object
      required:
        - schema
        - session_id
        - revision
        - turn
      properties:
        schema:
          const: p13i/agent-harness/presentation/v1
        session_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        turn:
          $ref: "#/components/schemas/PresentationTurn"
    CheckpointDiffResponse:
      type: object
      required:
        - diff
      properties:
        diff:
          $ref: "#/components/schemas/CheckpointDiff"
    CheckpointDiff:
      type: object
      additionalProperties: false
      required:
        - schema
        - checkpoint_id
        - session_id
        - language
        - start_line
        - next_start_line
        - total_lines
        - truncated
        - redactions
        - binary
        - changed_files
        - content
      properties:
        schema:
          const: p13i/agent-harness/presentation/v1
        checkpoint_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        language:
          const: diff
        start_line:
          type: integer
          minimum: 0
        next_start_line:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        total_lines:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        redactions:
          type: integer
          minimum: 0
        binary:
          type: boolean
        changed_files:
          type: array
          items:
            type: string
        content:
          type: string
    CreateSession:
      type: object
      required:
        - workspace
      properties:
        workspace:
          type: string
        name:
          type: string
        goal:
          type: string
        goal_kind:
          type: string
          enum:
            - finite
            - invariant
        constraints:
          type: array
          items:
            type: string
        predicates:
          type: array
          items:
            type: object
        budgets:
          type: object
        permission_mode:
          type: string
          enum:
            - approval
            - full
            - read-only
            - plan
        direct:
          type: boolean
        execution_profile:
          $ref: "#/components/schemas/ExecutionProfile"
        external_ref:
          $ref: "#/components/schemas/ExternalRef"
    ExternalRef:
      type: object
      additionalProperties: false
      required:
        - orchestrator
        - job_id
      properties:
        orchestrator:
          type: string
          minLength: 1
          maxLength: 128
        job_id:
          type: string
          minLength: 1
          maxLength: 256
    TurnRef:
      type: object
      additionalProperties: false
      required:
        - step_id
        - agent_role
      properties:
        step_id:
          type: string
          minLength: 1
          maxLength: 256
        agent_role:
          type: string
          minLength: 1
          maxLength: 128
    SubmitMessage:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
        provider:
          type: string
          enum:
            - claude
            - codex
        model:
          type: string
        effort:
          type: string
        workload:
          type: string
        turn_ref:
          $ref: "#/components/schemas/TurnRef"
    ReconciliationResolution:
      type: object
      additionalProperties: false
      required:
        - decision
        - observed_workspace_digest
      properties:
        decision:
          type: string
          enum:
            - accept-current
            - restore-pre-turn
            - stop
        observed_workspace_digest:
          type: string
          minLength: 1
        approval_id:
          type: string
          format: uuid
        audit:
          type: object
    BudgetExtension:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
        additional_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        additional_tokens:
          type: integer
          minimum: 1
          maximum: 300000
        allow_xhigh_once:
          type: boolean
    CreateProcessLease:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          enum:
            - claude
            - codex
        session_id:
          type: string
          format: uuid
        execution_profile:
          $ref: "#/components/schemas/ExecutionProfile"
    UpdateProcessLease:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - attach
            - heartbeat
            - release
        pid:
          type: integer
          minimum: 1
        pid_start:
          type: string
          minLength: 1
    ExecutionProfile:
      type: string
      enum:
        - interactive
        - live-smoke
        - unattended
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
